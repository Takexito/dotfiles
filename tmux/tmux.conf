# Рассчитан на долгие сессии по SSH: агент продолжает работать, даже когда
# соединение оборвалось, а вернувшись, видишь весь вывод целиком.

set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Без этого цвета в контейнере ломаются, а редакторы рисуют мусор.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Esc не должен «залипать» — иначе в vim и в TUI агентов заметные задержки.
set -sg escape-time 10
set -g focus-events on

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Делить окна по текущему каталогу, а не по домашнему.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display "конфиг перечитан"

# В строке состояния — имя сессии. Функция `dev` из shell/rc.sh называет сессию
# по проекту, поэтому видно, в каком контейнере находишься.
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[bg=colour24,fg=colour255] #S #[default] "
set -g status-left-length 40
set -g status-right "#[fg=colour244]%H:%M "
setw -g window-status-current-style "fg=colour255,bold"
